spring:
  application:
    name: portfolio-backend

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none   # CORRIGIDO: Nao derruba o boot por validacao estrita de schema
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true # CORRIGIDO: Permite migrations fora de ordem se travar no Railway
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Upload de arquivos (Sincronizado com o LocalFileStorageService)
app:
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
    public-url: ${APP_UPLOAD_PUBLIC_URL:http://localhost:8080/uploads}
    public-base-url: ${APP_UPLOAD_PUBLIC_URL:http://localhost:8080/uploads}
    max-image-size-mb: 5
    max-document-size-mb: 10

# Segurança administrativa (Padrão portfolio.* do README)
portfolio:
  admin:
    token: ${ADMIN_TOKEN:meu-token-seguro-123}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.portfolio: DEBUG