spring:
  application:
    name: portfolio-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway e a unica fonte de verdade do schema
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ------------------------------------------------------------------
# Upload de arquivos (foto de perfil, capa de projeto, curriculo).
# Armazenamento em disco local, servido como recurso estatico em
# /uploads/**.
# ------------------------------------------------------------------
app:
  upload:
    dir: ./uploads
    public-base-url: http://localhost:8080/uploads
    max-image-size-mb: 5
    max-document-size-mb: 10

# ------------------------------------------------------------------
# Seguranca administrativa (sem tabela de usuarios no banco).
# ------------------------------------------------------------------
admin:
  token: ${ADMIN_TOKEN:changeme-super-secret-token}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.portfolio.backend: DEBUG